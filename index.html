y","title":"Why I do this work","quote":"My job is to help refine the writer's voice, to help the writer clearly and effectively express his or her ideas.","paragraphs":["I am passionate about books. You have to be if you decide on a career in publishing. We're not here for the often joked about low salaries. Our story is the same across the board: We come to publishing with a love of reading, a love of stories and their power to change people's minds and, through this, (hopefully) the world. People in the industry are idealists. But our idealist hearts eventually beat up against the reality that publishing is a business, and then we have to learn to live in the intersection of art and commerce. Like everything else in life, that intersection can sometimes be unpretty and other times it's absolutely beautiful. I spent fourteen years in that place and have seen publishing take many twists and turns.","When I was an editorial assistant at Kensington, one of the best bosses I've ever had, the late Kate Duffy, Editorial Director of the Brava imprint, described, somewhat jokingly, an editor's role as the following: \"The editor represents the needs of the company to an author, and the author's needs to the company, while lying to each about the good intentions of the other.\" Kate told me there were two ways of going about the job. You're either a company's editor or a writer's editor, and God help you if you're a writer's editor. Editors love their books and strive to keep the peace, but the fact that we are salaried employees is never far from our thoughts. She already knew that I would be a writer's editor.","This leads me to why I became an editor in the first place. My parents came to New York from the Dominican Republic many years ago, and I am a born and bred New Yorker. I learned Spanish first and spoke it exclusively at home and learned English in school. In the conclave of Washington Heights, my parents never really learned to speak English, and in many ways I rative","description":"Drawing out stories through deep interviewing, then shaping raw material into structured, emotionally resonant narratives."}]},"services":{"section_label":"Services","title":"How we can work together","subtitle":"Every project is unique. Fees are determined on a case-by-case basis.","items":[{"number":"01","name":"Developmental Edit","description":"A comprehensive review including a detailed editorial letter and manuscript notes with page-by-page comments, suggestions, and queries focused on characterization, dialogue, plot, context, and narrative urgency.","features":["Detailed editorial letter","Page-by-page manuscript notes","One-hour consultation call","Career goal discussion"]},{"number":"02","name":"Evaluation","description":"A lighter-touch assessment with an editorial letter covering overall narrative thoughts — identifying issues like unnecessary characters, plot problems, or unresolved storylines without extensive marginalia.","features":["Editorial letter with narrative assessment","Key issue identification","One-hour phone or in-person meeting","Fee varies by project scope"]},{"number":"03","name":"Editorial Consultation","description":"For writers not yet ready for a full edit or still working on their manuscripts. A focused review of your work-in-progress with actionable guidance to keep your project moving forward.","features":["Review of up to 30 pages","Scheduled 30-minute follow-up call","Flat rate, paid upfront","Actionable next steps"]}],"note":"Sulay works with novels, short story collections, memoirs, articles, and essays. If her schedule doesn't permit or another specialist is better suited, she provides referrals to trusted colleagues."},"contact":{"section_label":"Get in Touch","title":"Let's talk about your manuscript","description":"Tell me about your writing background, provide a brief synopsis of your work, the genre you're writing in, and what kind of service interests you. Please allow up to one week for a respon ess. A masterwork. Grier triumphs again.","source":"Jimmy Kimmel"}]},"finding-marthas-place":{"title":"Finding Martha's Place","subtitle":"My Journey Through Sin, Salvation, and Lots of Soul Food","author":"Martha Hawkins","category":"nonfiction","description":"The inspiring memoir of a woman who overcame homelessness and hardship to build a beloved soul food restaurant in Montgomery, Alabama.","cover":"finding-marthas-place.jpg","quotes":[]},"im-still-standing":{"title":"I'm Still Standing","subtitle":"From Captive U.S. Soldier to Free Citizen — My Journey Home","author":"Shoshana Johnson","category":"nonfiction","description":"The first female POW of Operation Iraqi Freedom and the first black female POW in U.S. history shares the story of her capture in Iraq and her eventual release. National bestseller.","cover":"im-still-standing.jpg","quotes":[{"text":"Johnson endured her captivity with courage and emerged with honor. She vividly, simply, and unpretentiously tells her tale.","source":"Publisher's Weekly"}]},"my-infamous-life":{"title":"My Infamous Life","subtitle":"The Autobiography of Mobb Deep's Prodigy","author":"Albert 'Prodigy' Johnson with Laura Checkoway","category":"nonfiction","description":"Part ode to the concrete jungles of NYC and part shocking confessional on the burdens of fame during Hip Hop's Golden Era.","cover":"my-infamous-life.jpg","quotes":[{"text":"The legendary rapper unsentimentally details a life of beefs, brawls and murders during the heyday of East Coast hip-hop.","source":"The Washington Post"},{"text":"A surprising triumph, both as an archive of 1990s New York hip-hop folk tales and for its stirring sketches.","source":"Slate.com"}]},"never-make-the-same-mistake-twice":{"title":"Never Make the Same Mistake Twice","subtitle":"Lessons on Love and Life Learned the Hard Way","author":"Nene Leakes","category":"nonfiction","description":"Real Housewives of Atlanta star Nene Leakes shares lessons learned from life's challenges, offering     testimonials: {"testimonials":[{"quote":"I cannot thank Sulay enough for helping me get my writing career off to a great start. As an editor, she knew exactly how to improve my work with insightful pacing comments, thoughtful plot critiques, and spot-on character analyses.","author":"Boyd Morrison","work":"Author of The Ark, The Midas Code, and The Loch Ness Legacy"},{"quote":"I loved working with Sulay! Her passion, energy, and intelligence made this creative journey for me a joy.","author":"David Alan Grier","work":"Author of Barack Like Me"},{"quote":"Sulay Hernandez helped my first novel, Final Theory, become a great success. Her editorial advice improved the manuscript immensely. Thanks to her enthusiasm and guidance, I achieved the dream of every first-time author.","author":"Mark Alpert","work":"Author of Final Theory"},{"quote":"I felt safe with Sulay. That's the best way I can describe it. I felt like I — and my words — were safe with her.","author":"Aliya S. King","work":"Author of Platinum"},{"quote":"Sulay is the greatest thing that could have happened to me since I started writing my novel. She has the gift, the love and the knowledge to make any manuscript the best it can be.","author":"Rebeca Gomez Galindo","work":"Author of Kidnapped Innocence"},{"quote":"Sulay was absolutely instrumental to the success of my book. Her dedication and understanding of my story made it possible for her to work on my project while I was in a state prison. She is an amazing editor.","author":"Prodigy of Mobb Deep","work":"Author of My Infamous Life"},{"quote":"Sulay Hernandez understands that publishing is a business and writing is an art, and she seamlessly navigates each world and builds bridges between them. She's courageous, honest and savvy.","author":"Matthew Goodman","work":"Author of Hold Love Strong"},{"quote":"Working with Sulay Hernandez was a privilege. Her editorial notes were insightful, clear, and true to my characters. She not only improved my books, but also gave me the tools to become a better writer.","author":"Nora McFarland","work":"Author of A Bad Day's Work"},{"quote":"Sulay Hernandez is a dream boat editor. She is fearless, sensitive, with exceptional vision and taste. Working with her on my debut novel was a peak experience.","author":"Leslie Daniels","work":"Author of Cleaning Nabokov's House"},{"quote":"Sulay recognized something special in Prodigy's story and connected the dots to make our collaboration possible. She saw the strength in his raw self-expression and didn't shy away from controversial subject matter.","author":"Laura Checkoway","work":"Journalist & co-writer of My Infamous Life"},{"quote":"I often think of Sulay on my book writing journey. I have her to thank for so much of it. She believed in me and that made all the difference.","author":"M. L. Doyle","work":"Co-author of I'm Still Standing"},{"quote":"Nowhere did I find a more thoughtful, clear and patient editor than Sulay Hernandez. She let me own my work, my revisions, the final product. And yet her insights and wisdom were key to ensuring the complicated aspects of the memoir could be salient and succinct.","author":"Luis J. Rodriguez","work":"Author of It Calls You Back"}]}

  es: {
    content: {"meta":{"lang":"es","html_lang":"es","locale":"es_ES","page_title":"Unveiled Ink — Sulay Hernandez | Desarrollo editorial y consultoría literaria","page_description":"Edición de libros y manuscritos, escritura fantasma, colaboración y consultoría editorial con Sulay Hernandez — más de 20 años en la industria editorial.","og_title":"Unveiled Ink — Sulay Hernandez | Desarrollo editorial y consultoría literaria","og_description":"Más de 20 años dando forma a bestsellers, memorias y narrativas galardonadas. Desarrollo editorial, edición, escritura fantasma y consultoría.","twitter_title":"Unveiled Ink — Sulay Hernandez","twitter_description":"Desarrollo editorial y consultoría literaria. Más de 20 años dando forma a bestsellers, memorias y narrativas galardonadas."},"ui":{"skip_to_content":"Saltar al contenido","nav":{"home_aria":"Unveiled Ink — Inicio","toggle_aria":"Abrir menú","portfolio":"Portafolio","testimonials":"Testimonios","philosophy":"Filosofía","about":"Sobre mí","services":"Servicios","contact":"Contacto","lang_toggle_aria":"Cambiar idioma"},"hero":{"scroll":"Desplázate"},"portfolio":{"section_label":"Proyectos destacados","title":"Un portafolio que cruza géneros","subtitle":"Ficción, no ficción, memorias, escritura fantasma y más — proyectos que han llegado a listas de bestsellers y cosechado reconocimiento crítico.","filters":{"all":"Todos los proyectos","recent":"Recientes y próximos","literary":"Ficción literaria","popular":"Ficción popular","nonfiction":"No ficción"},"forthcoming_label":"Próximamente"},"testimonials":{"section_label":"Testimonios","prev_aria":"Testimonio anterior","next_aria":"Testimonio siguiente","nav_aria":"Navegación de testimonios","goto_aria":"Ir al testimonio"},"about_labels":{"education":"Formación","languages":"Idiomas","location":"Ubicación"},"contact_labels":{"email":"Correo electrónico","location":"Ubicación"},"form":{"first_name":"Nombre","last_name":"Apellido","email":"Correo electrónico","subject":"Asunto","message":"Tu mensaje","referral":"¿Cómo supiste de mí?","referral_placeholder":"Selecciona una opción","referral_search":"Búsqueda web","referral_referral":"Por recomendación","referral_social":"Redes sociales","referral_other":"Otro","honeypot_label":"No llenes este campo:","submit":"Enviar mensaje"},"modal":{"close_aria":"Cerrar","dialog_aria":"Detalles del libro"},"footer":{"tagline":"Desarrollo editorial y consultoría literaria","copyright":"© 2026 Unveiled Ink. Todos los derechos reservados."}},"hero":{"eyebrow":"Desarrollo editorial y consultoría literaria","headline_1":"Tienes una historia.","headline_2":"Yo puedo ayudarte a contarla."},"about":{"photo":"images/headshot.jpg","photo_credit":"Foto por Randy Ahart, Photo Pink NYC","section_label":"Sobre mí","title":"Más de veinte años dando forma<br>a bestsellers y obras premiadas","paragraphs":["Sulay Hernandez es la fundadora de <strong>Unveiled Ink<\/strong>, con más de dos décadas de experiencia en la industria editorial comercial y en la práctica editorial independiente. Antigua editora de <strong>Simon &amp; Schuster<\/strong> y editora senior de <strong>Other Press<\/strong>, su formación comenzó con pasantías en Penguin, Avalon Books, la Vigliano Literary Agency y Kensington Books.","A lo largo de su carrera ha desarrollado narrativa de no ficción, memorias, biografía y ficción tanto comercial como literaria, desde el concepto hasta la publicación — con enfoque en obras de alto perfil y relevancia cultural. Muchos de sus proyectos se han convertido en <strong>bestsellers nacionales e internacionales<\/strong> y en obras premiadas por la crítica.","Sulay ha enseñado El Proceso Editorial en el <strong>Programa de Certificación en Publicación del City College of New York<\/strong> y ha dictado la <strong>Serie de Conferencias Publishing 101 de Simon &amp; Schuster<\/strong>. Se la reconoce por su discreción, claridad estructural y la capacidad de guiar material complejo — y a las personalidades detrás de él — con firmeza y cuidado."],"details":{"education":"Licenciatura y Maestría en Bellas Artes, Sarah Lawrence College","languages":"Inglés y español","location":"Brooklyn, Nueva York"}},"philosophy":{"section_label":"Filosofía editorial","title":"Por qué hago este trabajo","quote":"Mi trabajo es ayudar a refinar la voz del escritor, ayudarlo a expresar sus ideas con claridad y eficacia.","paragraphs":["Los libros me apasionan. Tiene que ser así si decides dedicarte a la industria editorial. No estamos aquí por los sueldos bajos de los que tanto se bromea. Nuestra historia es la misma en todos los casos: llegamos a este mundo con amor por la lectura, por las historias y por su capacidad de cambiar la mente de las personas y, a través de eso, (ojalá) el mundo. La gente de esta industria es idealista. Pero el corazón idealista termina chocando con la realidad de que la industria editorial es un negocio, y entonces aprendemos a vivir en esa intersección entre arte y comercio. Como todo en la vida, a veces esa intersección es poco agraciada y otras veces es absolutamente hermosa. Pasé catorce años en ese lugar y he visto a la industria dar muchas vueltas.","Cuando era asistente editorial en Kensington, una de las mejores jefas que he tenido, la difunta Kate Duffy, Directora Editorial del sello Brava, describió — medio en broma — el rol de un editor así: \"El editor representa las necesidades de la empresa ante el autor y las necesidades del autor ante la empresa, mientras le miente a cada uno sobre las buenas intenciones del otro.\" Kate me dijo que había dos formas de hacer el trabajo. O eres la editora de la empresa o eres la editora del escritor, y que Dios te ayude si eres la editora del escritor. Los editores aman sus libros y se esfuerzan por mantener la paz, pero el hecho de que somos empleados asalariados nunca está muy lejos de nuestros pensamientos. Ella ya sabía que yo sería una editora del escritor.","Esto me lleva a por qué me hice editora en primer lugar. Mis padres llegaron a Nueva York desde la República Dominicana hace muchos años, y yo soy neoyorquina de pura cepa. Aprendí español primero y lo hablé exclusivamente en casa, y aprendí inglés en la escuela. En el cónclave de Washington Heights, mis padres nunca llegaron realmente a hablar inglés, y en muchos sentidos me convertí en sus ojos, oídos y boca. Les traducía todo. Como editores, somos responsables de ayudar a los escritores a decir lo que realmente necesitan y quieren decir. Ayudamos a los autores a traducir sus pensamientos para el mundo lector, y lo hacemos indagando y cuestionando con respeto, con la conciencia de que estamos habitando temporalmente el mundo de otra persona. Y aunque tengo una conexión emocional con una historia, hago lo posible por mantenerme objetiva en mis comentarios. Mi trabajo es ayudar a refinar la voz del escritor, ayudarlo a expresar sus ideas con claridad y eficacia. La relación entre un editor y un escritor no puede describirse como puramente profesional. ¿Cómo podría serlo? Empieza con enamorarnos de un manuscrito y saber que podemos hacerlo aún mejor. Como muchos autores pueden atestiguar, sus editores a menudo se convierten en sus amigos, manteniendo el contacto mucho después de que los libros están terminados.","Después de más de una década trabajando para editoriales, creé Unveiled Ink porque prefiero trabajar para el escritor. Mi verdad más simple es que ayudar a la gente a decir lo que necesita decir me hace feliz. Así que, ya sea que tu meta sea publicar con una editorial o auto-publicarte, te prometo que haré por ti lo que llevo haciendo desde hace mucho tiempo — te ayudaré a contar tu historia."]},"skills":{"section_label":"Especialidades principales","title":"Habilidades clave","items":[{"name":"Escritura fantasma y colaboración","description":"Creación de narrativas convincentes en nombre de figuras públicas, ejecutivos y autores que publican por primera vez — traduciendo su voz y visión en manuscritos pulidos."},{"name":"Edición de desarrollo y de línea","description":"Edición profunda a nivel estructural y de oración que fortalece caracterización, ritmo, diálogo y urgencia narrativa desde el primer borrador hasta el manuscrito final."},{"name":"Desarrollo de propuestas","description":"Construcción de propuestas editoriales convincentes que capturan la historia única del autor y la posicionan de manera efectiva ante agentes y editoriales."},{"name":"Narrativa a partir de entrevistas","description":"Extracción de historias a través de entrevistas profundas, y la posterior conformación de ese material en bruto en narrativas estructuradas y emocionalmente resonantes."}]},"services":{"section_label":"Servicios","title":"Cómo podemos trabajar juntos","subtitle":"Cada proyecto es único. Las tarifas se determinan caso por caso.","items":[{"number":"01","name":"Edición de desarrollo","description":"Una revisión exhaustiva que incluye una carta editorial detallada y notas al manuscrito con comentarios, sugerencias y consultas página por página, con foco en caracterización, diálogo, trama, contexto y urgencia narrativa.","features":["Carta editorial detallada","Notas al manuscrito página por página","Llamada de consulta de una hora","Conversación sobre metas profesionales"]},{"number":"02","name":"Evaluación","description":"Una valoración de menor alcance con una carta editorial que cubre los aspectos generales de la narrativa — identificando problemas como personajes innecesarios, fallos de trama o líneas narrativas sin resolver, sin glosas extensas al margen.","features":["Carta editorial con valoración narrativa","Identificación de problemas clave","Reunión de una hora, telefónica o presencial","Tarifa según el alcance del proyecto"]},{"number":"03","name":"Consulta editorial","description":"Para escritores que aún no están listos para una edición completa o que todavía están trabajando en sus manuscritos. Una revisión enfocada de tu obra en curso, con orientación accionable para que tu proyecto siga avanzando.","features":["Revisión de hasta 30 páginas","Llamada de seguimiento de 30 minutos agendada","Tarifa fija, pagada por adelantado","Próximos pasos accionables"]}],"note":"Sulay trabaja con novelas, colecciones de cuentos, memorias, artículos y ensayos. Si su agenda no lo permite o si otro especialista se ajusta mejor al proyecto, ofrece recomendaciones de colegas de confianza."},"contact":{"section_label":"Contacto","title":"Hablemos de tu manuscrito","description":"Cuéntame sobre tu trayectoria como escritor, ofréceme una breve sinopsis de tu obra, el género en el que estás escribiendo, y qué tipo de servicio te interesa. Por favor, espera hasta una semana para recibir una respuesta.","email":"Sulay@unveiledink.com","location":"Brooklyn, Nueva York","linkedin":"https://www.linkedin.com/in/sulay-hernandez-1b230a7"}},

// === LANGUAGE RESOLUTION ===
function detectLang() {
  const params = new URLSearchParams(window.location.search);
  const fromUrl = params.get('lang');
  if (fromUrl === 'es' || fromUrl === 'en') return fromUrl;
  try {
    const fromStorage = localStorage.getItem('ui_lang');
    if (fromStorage === 'es' || fromStorage === 'en') return fromStorage;
  } catch (e) {}
  return 'en';
}

let currentLang = detectLang();

// === SHARED RANDOM ORDER FOR NON-PRIORITY BOOKS ===
// Computed once so EN/ES renders match.
function computeBookOrder(books, priority) {
  const nonPriority = Object.keys(books).filter(k => !priority.includes(k));
  for (let i = nonPriority.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [nonPriority[i], nonPriority[j]] = [nonPriority[j], nonPriority[i]];
  }
  return [...priority, ...nonPriority];
}
const bookOrder = computeBookOrder(DATA.en.books.books, DATA.en.books.priority);

// === SCROLL REVEAL OBSERVER ===
const revealObserver = new IntersectionObserver(entries => {
  entries.forEach(entry => { if (entry.isIntersecting) entry.target.classList.add('visible'); });
}, { threshold: 0.1, rootMargin: '0px 0px -40px 0px' });

function observeReveals(root) {
  (root || document).querySelectorAll('.reveal').forEach(el => revealObserver.observe(el));
}

// === UTILITY: safe text for attributes ===
function escapeAttr(s) { return String(s).replace(/&/g, '&amp;').replace(/"/g, '&quot;').replace(/</g, '&lt;').replace(/>/g, '&gt;'); }

// === RENDER HEAD META ===
function renderMeta(content) {
  const m = content.meta;
  document.documentElement.lang = m.html_lang;
  document.title = m.page_title;
  setMeta('name', 'description', m.page_description);
  setMeta('property', 'og:title', m.og_title);
  setMeta('property', 'og:description', m.og_description);
  setMeta('property', 'og:locale', m.locale);
  setMeta('name', 'twitter:title', m.twitter_title);
  setMeta('name', 'twitter:description', m.twitter_description);
}
function setMeta(attr, key, value) {
  const el = document.querySelector(`meta[${attr}="${key}"]`);
  if (el) el.setAttribute('content', value);
}

      const filter = btn.dataset.filter;
      document.querySelectorAll('.book-card').forEach(card => {
        card.style.display = (filter === 'all' || card.dataset.category.includes(filter)) ? '' : 'none';
      });
    });
  });
  // Grid
  const grid = document.getElementById('portfolioGrid');
  grid.innerHTML = '';
  bookOrder.forEach(slug => {
    const book = books.books[slug];
    if (!book) return;
    const card = document.createElement('div');
    card.className = 'book-card';
    card.dataset.category = book.category;
    card.dataset.slug = slug;
    card.setAttribute('role', 'button');
    card.setAttribute('tabindex', '0');
    card.setAttribute('aria-label', book.title);
    if (book.cover) {
      card.innerHTML = '<img src="images/covers/' + book.cover + '" alt="' + escapeAttr(book.title) + '" loading="lazy"><div class="book-card-overlay"><span>' + book.title + '</span></div>';
    } else {
      card.innerHTML = '<div class="book-placeholder"><span>' + book.title + '<br>' + uiP.forthcoming_label + '</span></div><div class="book-card-overlay"><span>' + book.title + '</span></div>';
    }
    card.addEventListener('click', () => openBookModal(slug));
    card.addEventListener('keydown', e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); openBookModal(slug); } });
    grid.appendChild(card);
  });
}

// === RENDER TESTIMONIALS ===
let testimonialState = null;
function renderTestimonials(content, testimonials) {
  const ui = content.ui.testimonials;
  const track = document.getElementById('testimonialTrack');
  const dotsContainer = document.getElementById('testimonialDots');
  track.innerHTML = '';
  dotsContainer.innerHTML = '';
  testimonials.testimonials.forEach((t, i) => {
    const slide = document.createElement('div');
    slide.className = 'testimonial-slide';
    slide.innerHTML = '<p class="testimonial-quote">' + t.quote + '</p><p class="testimonial-author">' + t.author + '</p><p class="testimonial-work">' + t.work + '</p>';
    track.appendChild(slide);
    const dot = document.createElement('button');
    dot.className = 'testimonial-dot' + (i === 0 ? ' active' : '');
    dot.setAttribute('aria-label', ui.goto_aria + ' ' + (i + 1));
    dot.addEventListener('click', () => goTo(i));
    dotsContainer.appendChild(dot);
  });
  // Reset state on re-render
  if (testimonialState && testimonialState.autoplay) clearInterval(testimonialState.autoplay);
  let current = 0;
  const slides = track.querySelectorAll('.testimonial-slide');
  function goTo(index) {
    current = index;
    track.style.transform = 'translateX(-' + (current * 100) + '%)';
    dotsContainer.querySelectorAll('.testimonial-dot').forEach((d, i) => d.classList.toggle('active', i === current));
  }
  function startAutoplay() { return setInterval(() => goTo(current === slides.length - 1 ? 0 : current + 1), 6000); }
  function resetAutoplay() { clearInterval(testimonialState.autoplay); testimonialState.autoplay = startAutoplay(); }
  // Reattach arrow handlers (remove old ones by cloning)
  const prevBtn = document.getElementById('prevBtn');
  const nextBtn = document.getElementById('nextBtn');
  const newPrev = prevBtn.cloneNode(true);
  const newNext = nextBtn.cloneNode(true);
  prevBtn.parentNode.replaceChild(newPrev, prevBtn);
  nextBtn.parentNode.replaceChild(newNext, nextBtn);
  newPrev.addEventListener('click', () => { goTo(current === 0 ? slides.length - 1 : current - 1); resetAutoplay(); });
  newNext.addEventListener('click', () => { goTo(current === slides.length - 1 ? 0 : current + 1); resetAutoplay(); });
  testimonialState = { autoplay: startAutoplay(), goTo };
}

// === MODAL ===
const modal = document.getElementById('bookModal');
const modalClose = document.getElementById('modalClose');
function openBookModal(slug) {
  const book = DATA[currentLang].books.books[slug];
  if (!book) return;
  if (book.cover) {
    document.getElementById('modalCover').src = 'images/covers/' + book.cover;
    document.getElementById('modalCover').alt = book.title;
  } else {
    document.getElementById('modalCover').src = '';
    document.getElementById('modalCover').alt = '';
  }
  let titleHtml = book.title;
  if (book.subtitle) titleHtml += '<em>' + book.subtitle + '</em>';
  document.getElementById('modalTitle').innerHTML = titleHtml;
  document.getElementById('modalAuthor').textContent = book.author;
  document.getElementById('modalDesc').textContent = book.description;
  const quotesEl = document.getElementById('modalQuotes');
  if (book.quotes && book.quotes.length > 0) {
    quotesEl.innerHTML = book.quotes.map(q => '<div class="book-modal-quote"><p>\u201C' + q.text + '\u201D</p><cite>\u2014 ' + q.source + '</cite></div>').join('');
    quotesEl.style.display = 'block';
  } else {
    quotesEl.style.display = 'none';
  }
  modal.classList.add('active');
  document.body.style.overflow = 'hidden';
  modalClose.focus();
}
function closeModal() { modal.classList.remove('active'); document.body.style.overflow = ''; }
modalClose.addEventListener('click', closeModal);
modal.addEventListener('click', e => { if (e.target === modal) closeModal(); });
document.addEventListener('keydown', e => { if (e.key === 'Escape') closeModal(); });

// === FULL RENDER ===
function render(lang) {
  currentLang = lang;
  const data = DATA[lang];
  renderMeta(data.content);
  renderChrome(data.content);
  renderPortfolio(data.content, data.books);
  renderTestimonials(data.content, data.testimonials);
  renderPhilosophy(data.content);
  renderAbout(data.content);
  renderSkills(data.content);
  renderServices(data.content);
  renderContact(data.content);
  // Observe newly-minted reveal elements
  observeReveals(document);
  // Re-wire nav hamburger (rebuilt in renderChrome)
  wireNav();
  // Re-wire smooth scroll
  wireSmoothScroll();
  // Update toggle state
  document.querySelectorAll('#langToggle button').forEach(b => {
    b.classList.toggle('active', b.dataset.lang === lang);
    b.setAttribute('aria-pressed', b.dataset.lang === lang);
  });
  // Update URL without full reload (but allow bookmarking)
  const url = new URL(window.location.href);
  if (lang === 'es') url.searchParams.set('lang', 'es');
  else url.searchParams.delete('lang');
  window.history.replaceState({}, '', url);
  // Persist
  try { localStorage.setItem('ui_lang', lang); } catch (e) {}
}

// === NAV WIRING ===
function wireNav() {
  const toggle = document.getElementById('navToggle');
  const links = document.getElementById('navLinks');
  // Remove any existing handlers by cloning
  const newToggle = toggle.cloneNode(true);
  toggle.parentNode.replaceChild(newToggle, toggle);
  newToggle.addEventListener('click', () => {
    const open = !newToggle.classList.contains('open');
    newToggle.classList.toggle('open');
    links.classList.toggle('open');
    newToggle.setAttribute('aria-expanded', open);
  });
  links.querySelectorAll('a').forEach(a => a.addEventListener('click', () => {
    newToggle.classList.remove('open');
    links.classList.remove('open');
    newToggle.setAttribute('aria-expanded', 'false');
  }));
}

// === SMOOTH SCROLL ===
let smoothScrollWired = false;
function wireSmoothScroll() {
  // Use event delegation on document so we don't double-bind on re-render.
  if (smoothScrollWired) return;
  smoothScrollWired = true;
  document.addEventListener('click', e => {
    const a = e.target.closest('a[href^="#"]');
    if (!a) return;
    const href = a.getAttribute('href');
    if (href === '#' || href.length <= 1) return;
    const target = document.querySelector(href);
    if (!target) return;
    e.preventDefault();
    const top = target.getBoundingClientRect().top + window.pageYOffset - 70;
    window.scrollTo({ top, behavior: 'smooth' });
  });
}

// === NAV SCROLL STYLING ===
const navEl = document.getElementById('nav');
window.addEventListener('scroll', () => navEl.classList.toggle('scrolled', window.scrollY > 60));

// === LANGUAGE TOGGLE WIRING ===
document.getElementById('langToggle').addEventListener('click', e => {
  const btn = e.target.closest('button[data-lang]');
  if (!btn) return;
  const lang = btn.dataset.lang;
  if (lang === currentLang) return;
  render(lang);
});

// === INITIAL RENDER ===
render(currentLang);

// === SCROLL-LINKED BACKGROUND FALLBACK ===
if (typeof CSS === "undefined" || !CSS.supports || !CSS.supports('animation-timeline', 'scroll()')) {
  const s = document.createElement('style');
  s.textContent = 'body::before { animation: none !important; }';
  document.head.appendChild(s);
  window.addEventListener('scroll', function() {
    const f = window.scrollY / (document.body.scrollHeight - window.innerHeight);
    document.body.style.setProperty('--scroll-offset', (f * -200) + 'vh');
  });
  const s2 = document.createElement('style');
  s2.textContent = 'body::before { background-position: 0 var(--scroll-offset, 0vh) !important; }';
  document.head.appendChild(s2);
}
