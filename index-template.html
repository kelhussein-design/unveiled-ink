.footer-logo-sub { font-family: var(--font-sans); font-size: 0.68rem; font-weight: 400; letter-spacing: 0.35em; text-transform: uppercase; color: var(--gray-warm); margin-bottom: 20px; }
.footer-tagline { font-family: var(--font-sans); font-size: 0.68rem; letter-spacing: 0.08em; color: var(--gray-warm); margin-bottom: 16px; }
.footer-links { display: flex; justify-content: center; gap: 24px; list-style: none; margin-bottom: 20px; flex-wrap: wrap; }
.footer-links a { font-family: var(--font-sans); font-size: 0.62rem; letter-spacing: 0.1em; text-transform: uppercase; color: var(--gray-warm); transition: color 0.3s; }
.footer-links a:hover { color: var(--cream); }
.footer-copy { font-family: var(--font-sans); font-size: 0.58rem; letter-spacing: 0.08em; color: rgba(138, 132, 128, 0.6); }

/* BOOK MODAL */
.book-modal-overlay { position: fixed; inset: 0; background: rgba(42, 37, 35, 0.7); backdrop-filter: blur(4px); z-index: 2000; opacity: 0; pointer-events: none; transition: opacity 0.4s; overflow-y: auto; display: flex; align-items: flex-start; justify-content: center; padding: 60px 20px; }
.book-modal-overlay.active { opacity: 1; pointer-events: all; }
.book-modal { background: var(--white); max-width: 720px; width: 100%; position: relative; transform: translateY(30px); transition: transform 0.4s cubic-bezier(0.25, 0.46, 0.45, 0.94); margin: auto; }
.book-modal-overlay.active .book-modal { transform: translateY(0); }
.book-modal-close { position: absolute; top: 16px; right: 20px; font-size: 1.5rem; color: var(--gray-warm); cursor: pointer; z-index: 10; background: none; border: none; font-family: var(--font-sans); transition: color 0.3s; line-height: 1; }
.book-modal-close:hover { color: var(--ink); }
.book-modal-header { display: flex; gap: clamp(20px, 3vw, 36px); padding: clamp(24px, 4vw, 44px); padding-bottom: 0; }
.book-modal-cover { width: clamp(120px, 20vw, 180px); flex-shrink: 0; }
.book-modal-cover img { width: 100%; aspect-ratio: 2/3; object-fit: cover; border: 1px solid var(--beige); }
.book-modal-info { flex: 1; min-width: 0; }
.book-modal-info h2 { font-family: var(--font-display); font-size: clamp(1.4rem, 2.5vw, 1.8rem); font-weight: 500; color: var(--ink); line-height: 1.25; margin-bottom: 0.25rem; }
.book-modal-info h2 em { font-style: italic; font-weight: 400; font-size: 0.85em; color: var(--gray-mid); display: block; margin-top: 2px; }
.book-modal-author { font-family: var(--font-sans); font-size: 0.72rem; letter-spacing: 0.1em; text-transform: uppercase; color: var(--blue-accent); margin-bottom: 1rem; }
.book-modal-desc { font-size: 0.9rem; color: var(--gray-mid); line-height: 1.7; }
.book-modal-body { padding: clamp(24px, 4vw, 44px); }
.book-modal-quotes { margin-top: 1.5rem; border-top: 1px solid var(--beige); padding-top: 1.5rem; }
.book-modal-quote { margin-bottom: 1.25rem; padding-left: 16px; border-left: 2px solid var(--blue-mist); }
.book-modal-quote p { font-family: var(--font-display); font-size: 1rem; font-style: italic; color: var(--gray-dark); line-height: 1.6; margin-bottom: 4px; }
.book-modal-quote cite { font-family: var(--font-sans); font-size: 0.65rem; letter-spacing: 0.08em; color: var(--gray-warm); font-style: normal; }
@media (max-width: 520px) {
  .book-modal-header { flex-direction: column; align-items: center; text-align: center; }
  .book-modal-cover { width: 140px; }
}
</style>
</head>
<body>

<script>
// === DATA (bilingual) ===
// All content for EN and ES. Rendered via render(lang).
// Exposed on window so preview tooling (e.g. Decap CMS) and debug scripts
// can inspect the loaded content.
const DATA = {
  en: {
    content: CONTENT_EN_PLACEHOLDER,
    books: BOOKS_EN_PLACEHOLDER,
    testimonials: TESTIMONIALS_EN_PLACEHOLDER
  },
  es: {
    content: CONTENT_ES_PLACEHOLDER,
    books: BOOKS_ES_PLACEHOLDER,
    testimonials: TESTIMONIALS_ES_PLACEHOLDER
  }
};
window.DATA = DATA;

// === LANGUAGE RESOLUTION ===
function detectLang() {
  const params = new URLSearchParams(window.location.search);
  const fromUrl = params.get('lang');
  if (fromUrl === 'es' || fromUrl === 'en') return fromUrl;
  try {
    const fromStorage = localStorage.getItem('ui_lang');
    if (fromStorage === 'es' || fromStorage === 'en') return fromStorage;
  } catch (e) {}
  return 'en';
}

let currentLang = detectLang();

// === SHARED RANDOM ORDER FOR NON-PRIORITY BOOKS ===
// Computed once so EN/ES renders match.
function computeBookOrder(books, priority) {
  const nonPriority = Object.keys(books).filter(k => !priority.includes(k));
  for (let i = nonPriority.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [nonPriority[i], nonPriority[j]] = [nonPriority[j], nonPriority[i]];
  }
  return [...priority, ...nonPriority];
}
const bookOrder = computeBookOrder(DATA.en.books.books, DATA.en.books.priority);

// === SCROLL REVEAL OBSERVER ===
const revealObserver = new IntersectionObserver(entries => {
  entries.forEach(entry => { if (entry.isIntersecting) entry.target.classList.add('visible'); });
}, { threshold: 0.1, rootMargin: '0px 0px -40px 0px' });

function observeReveals(root) {
  (root || document).querySelectorAll('.reveal').forEach(el => revealObserver.observe(el));
}

// === UTILITY: safe text for attributes ===
function escapeAttr(s) { return String(s).replace(/&/g, '&amp;').replace(/"/g, '&quot;').replace(/</g, '&lt;').replace(/>/g, '&gt;'); }

// === RENDER HEAD META ===
function renderMeta(content) {
  const m = content.meta;
  document.documentElement.lang = m.html_lang;
  document.title = m.page_title;
  setMeta('name', 'description', m.page_description);
  setMeta('property', 'og:title', m.og_title);
  setMeta('property', 'og:description', m.og_description);
  setMeta('property', 'og:locale', m.locale);
  setMeta('name', 'twitter:title', m.twitter_title);
  setMeta('name', 'twitter:description', m.twitter_description);
}
function setMeta(attr, key, value) {
  const el = document.querySelector(`meta[${attr}="${key}"]`);
  if (el) el.setAttribute('content', value);
}

// === RENDER NAV + UI CHROME ===
function renderChrome(content) {
  const ui = content.ui;
  // Skip link
  document.getElementById('skipLink').textContent = ui.skip_to_content;
  // Nav logo aria
  document.getElementById('navLogo').setAttribute('aria-label', ui.nav.home_aria);
  // Nav toggle aria
  document.getElementById('navToggle').setAttribute('aria-label', ui.nav.toggle_aria);
  // Nav links
  const navLinksEl = document.getElementById('navLinks');
  navLinksEl.innerHTML = [
    ['#portfolio', ui.nav.portfolio],
    ['#testimonials', ui.nav.testimonials],
    ['#philosophy', ui.nav.philosophy],
    ['#about', ui.nav.about],
    ['#services', ui.nav.services],
    ['#contact', ui.nav.contact]
  ].map(([href, label]) => `<li><a href="${href}">${label}</a></li>`).join('');
  // Lang toggle aria
  document.getElementById('langToggle').setAttribute('aria-label', ui.nav.lang_toggle_aria);
  // Hero
  document.getElementById('heroEyebrow').textContent = content.hero.eyebrow;
  document.getElementById('heroHeadline').innerHTML = content.hero.headline_1 + '<em>' + content.hero.headline_2 + '</em>';
  document.getElementById('heroScroll').textContent = ui.hero.scroll;
  // Footer
  document.getElementById('footerTagline').textContent = ui.footer.tagline;
  document.getElementById('footerCopy').textContent = ui.footer.copyright;
  const footerLinksEl = document.getElementById('footerLinks');
  footerLinksEl.innerHTML = [
    ['#portfolio', ui.nav.portfolio],
    ['#testimonials', ui.nav.testimonials],
    ['#philosophy', ui.nav.philosophy],
    ['#about', ui.nav.about],
    ['#services', ui.nav.services],
    ['#contact', ui.nav.contact]
  ].map(([href, label]) => `<li><a href="${href}">${label}</a></li>`).join('');
  // Modal aria
  document.getElementById('bookModal').setAttribute('aria-label', ui.modal.dialog_aria);
  document.getElementById('modalClose').setAttribute('aria-label', ui.modal.close_aria);
  // Testimonials aria
  document.getElementById('prevBtn').setAttribute('aria-label', ui.testimonials.prev_aria);
  document.getElementById('nextBtn').setAttribute('aria-label', ui.testimonials.next_aria);
  document.getElementById('testimonialDots').setAttribute('aria-label', ui.testimonials.nav_aria);
  document.getElementById('testimonialsLabel').textContent = ui.testimonials.section_label;
}

// === RENDER PORTFOLIO ===
function renderPortfolio(content, books) {
  const uiP = content.ui.portfolio;
  // Header
  document.getElementById('portfolioHeader').innerHTML = `
    <span class="section-label">${uiP.section_label}</span>
    <h2 class="section-title">${uiP.title}</h2>
    <p style="font-size:0.92rem; color: var(--gray-mid); margin-bottom: 1rem; max-width: 600px;">${uiP.subtitle}</p>`;
  // Filters
  const filters = [
    ['all', uiP.filters.all],
    ['recent', uiP.filters.recent],
    ['literary', uiP.filters.literary],
    ['popular', uiP.filters.popular],
    ['nonfiction', uiP.filters.nonfiction]
  ];
  const filtersEl = document.getElementById('portfolioFilters');
  filtersEl.innerHTML = filters.map(([val, label], i) => `<button class="filter-btn${i===0?' active':''}" data-filter="${val}">${label}</button>`).join('');
  filtersEl.querySelectorAll('.filter-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      filtersEl.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      const filter = btn.dataset.filter;
      document.querySelectorAll('.book-card').forEach(card => {
        card.style.display = (filter === 'all' || card.dataset.category.includes(filter)) ? '' : 'none';
      });
    });
  });
  // Grid
  const grid = document.getElementById('portfolioGrid');
  grid.innerHTML = '';
  bookOrder.forEach(slug => {
    const book = books.books[slug];
    if (!book) return;
    const card = document.createElement('div');
    card.className = 'book-card';
    card.dataset.category = book.category;
    card.dataset.slug = slug;
    card.setAttribute('role', 'button');
    card.setAttribute('tabindex', '0');
    card.setAttribute('aria-label', book.title);
    if (book.cover) {
      card.innerHTML = '<img src="images/covers/' + book.cover + '" alt="' + escapeAttr(book.title) + '" loading="lazy"><div class="book-card-overlay"><span>' + book.title + '</span></div>';
    } else {
      card.innerHTML = '<div class="book-placeholder"><span>' + book.title + '<br>' + uiP.forthcoming_label + '</span></div><div class="book-card-overlay"><span>' + book.title + '</span></div>';
    }
    card.addEventListener('click', () => openBookModal(slug));
    card.addEventListener('keydown', e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); openBookModal(slug); } });
    grid.appendChild(card);
  });
}

// === RENDER TESTIMONIALS ===
let testimonialState = null;
function renderTestimonials(content, testimonials) {
  const ui = content.ui.testimonials;
  const track = document.getElementById('testimonialTrack');
  const dotsContainer = document.getElementById('testimonialDots');
  track.innerHTML = '';
  dotsContainer.innerHTML = '';
  testimonials.testimonials.forEach((t, i) => {
    const slide = document.createElement('div');
    slide.className = 'testimonial-slide';
    slide.innerHTML = '<p class="testimonial-quote">' + t.quote + '</p><p class="testimonial-author">' + t.author + '</p><p class="testimonial-work">' + t.work + '</p>';
    track.appendChild(slide);
    const dot = document.createElement('button');
    dot.className = 'testimonial-dot' + (i === 0 ? ' active' : '');
    dot.setAttribute('aria-label', ui.goto_aria + ' ' + (i + 1));
    dot.addEventListener('click', () => goTo(i));
    dotsContainer.appendChild(dot);
  });
  // Reset state on re-render
  if (testimonialState && testimonialState.autoplay) clearInterval(testimonialState.autoplay);
  let current = 0;
  const slides = track.querySelectorAll('.testimonial-slide');
  function goTo(index) {
    current = index;
    track.style.transform = 'translateX(-' + (current * 100) + '%)';
    dotsContainer.querySelectorAll('.testimonial-dot').forEach((d, i) => d.classList.toggle('active', i === current));
  }
  function startAutoplay() { return setInterval(() => goTo(current === slides.length - 1 ? 0 : current + 1), 6000); }
  function resetAutoplay() { clearInterval(testimonialState.autoplay); testimonialState.autoplay = startAutoplay(); }
  // Reattach arrow handlers (remove old ones by cloning)
  const prevBtn = document.getElementById('prevBtn');
  const nextBtn = document.getElementById('nextBtn');
  const newPrev = prevBtn.cloneNode(true);
  const newNext = nextBtn.cloneNode(true);
  prevBtn.parentNode.replaceChild(newPrev, prevBtn);
  nextBtn.parentNode.replaceChild(newNext, nextBtn);
  newPrev.addEventListener('click', () => { goTo(current === 0 ? slides.length - 1 : current - 1); resetAutoplay(); });
  newNext.addEventListener('click', () => { goTo(current === slides.length - 1 ? 0 : current + 1); resetAutoplay(); });
  testimonialState = { autoplay: startAutoplay(), goTo };
}

// === RENDER PHILOSOPHY ===
function renderPhilosophy(content) {
  const c = content.philosophy;
  const el = document.getElementById('philosophyContent');
  el.innerHTML = '<span class="section-label">' + c.section_label + '</span><h2 class="section-title">' + c.title + '</h2><blockquote>\u201C' + c.quote + '\u201D</blockquote><div class="philosophy-text">' + c.paragraphs.map(p => '<p>' + p + '</p>').join('') + '</div>';
}

// === RENDER ABOUT ===
function renderAbout(content) {
  const c = content.about;
  const labels = content.ui.about_labels;
  const el = document.getElementById('aboutContent');
  el.innerHTML = '<div class="about-photo-wrap reveal"><img src="' + c.photo + '" alt="Sulay Hernandez" class="about-photo"><p class="about-photo-credit">' + c.photo_credit + '</p></div><div class="about-text reveal" style="transition-delay: 0.15s;"><span class="section-label">' + c.section_label + '</span><h2 class="section-title">' + c.title + '</h2>' + c.paragraphs.map(p => '<p>' + p + '</p>').join('') + '<div class="about-details"><div><div class="about-detail-label">' + labels.education + '</div><div class="about-detail-value">' + c.details.education + '</div></div><div><div class="about-detail-label">' + labels.languages + '</div><div class="about-detail-value">' + c.details.languages + '</div></div><div><div class="about-detail-label">' + labels.location + '</div><div class="about-detail-value">' + c.details.location + '</div></div></div></div>';
  observeReveals(el);
}

// === RENDER SKILLS ===
function renderSkills(content) {
  const c = content.skills;
  document.getElementById('skillsHeader').innerHTML = '<span class="section-label">' + c.section_label + '</span><h2 class="section-title">' + c.title + '</h2>';
  const grid = document.getElementById('skillsGrid');
  grid.innerHTML = '';
  c.items.forEach((s, i) => {
    const card = document.createElement('div');
    card.className = 'skill-card reveal';
    card.style.transitionDelay = (i * 0.1) + 's';
    card.innerHTML = '<h3>' + s.name + '</h3><p>' + s.description + '</p>';
    grid.appendChild(card);
    revealObserver.observe(card);
  });
}

// === RENDER SERVICES ===
function renderServices(content) {
  const c = content.services;
  document.getElementById('servicesHeader').innerHTML = '<span class="section-label">' + c.section_label + '</span><h2 class="section-title">' + c.title + '</h2><p style="font-size: 0.88rem; color: var(--gray-mid); margin-bottom: 0.5rem;">' + c.subtitle + '</p>';
  const grid = document.getElementById('servicesGrid');
  grid.innerHTML = '';
  c.items.forEach((s, i) => {
    const card = document.createElement('div');
    card.className = 'service-card reveal';
    card.style.transitionDelay = (i * 0.1) + 's';
    card.innerHTML = '<div class="service-number">' + s.number + '</div><h3>' + s.name + '</h3><p>' + s.description + '</p><ul class="service-features">' + s.features.map(f => '<li>' + f + '</li>').join('') + '</ul>';
    grid.appendChild(card);
    revealObserver.observe(card);
  });
  document.getElementById('servicesNote').textContent = c.note;
}

// === RENDER CONTACT ===
function renderContact(content) {
  const c = content.contact;
  const labels = content.ui.contact_labels;
  const form = content.ui.form;
  document.getElementById('contactInfo').innerHTML = '<span class="section-label">' + c.section_label + '</span><h2 class="section-title">' + c.title + '</h2><p>' + c.description + '</p><div class="contact-detail"><div class="contact-detail-label">' + labels.email + '</div><div class="contact-detail-value"><a href="mailto:' + c.email + '">' + c.email + '</a></div></div><div class="contact-detail"><div class="contact-detail-label">' + labels.location + '</div><div class="contact-detail-value">' + c.location + '</div></div><div class="contact-social"><a href="' + c.linkedin + '" target="_blank" rel="noopener noreferrer"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24"><path d="M20.447 20.452h-3.554v-5.569c0-1.328-.027-3.037-1.852-3.037-1.853 0-2.136 1.445-2.136 2.939v5.667H9.351V9h3.414v1.561h.046c.477-.9 1.637-1.85 3.37-1.85 3.601 0 4.267 2.37 4.267 5.455v6.286zM5.337 7.433a2.062 2.062 0 01-2.063-2.065 2.064 2.064 0 112.063 2.065zm1.782 13.019H3.555V9h3.564v11.452zM22.225 0H1.771C.792 0 0 .774 0 1.729v20.542C0 23.227.792 24 1.771 24h20.451C23.2 24 24 23.227 24 22.271V1.729C24 .774 23.2 0 22.222 0h.003z"/></svg>LinkedIn</a></div>';
  // Contact form
  const formEl = document.getElementById('contactForm');
  formEl.innerHTML = '<input type="hidden" name="form-name" value="contact"><p style="display:none;"><label>' + form.honeypot_label + ' <input name="bot-field"></label></p><div class="form-row"><div class="form-field"><label for="fname">' + form.first_name + '</label><input type="text" id="fname" name="fname" required autocomplete="given-name"></div><div class="form-field"><label for="lname">' + form.last_name + '</label><input type="text" id="lname" name="lname" required autocomplete="family-name"></div></div><div class="form-field"><label for="email">' + form.email + '</label><input type="email" id="email" name="email" required autocomplete="email"></div><div class="form-field"><label for="subject">' + form.subject + '</label><input type="text" id="subject" name="subject"></div><div class="form-field"><label for="message">' + form.message + '</label><textarea id="message" name="message" rows="5" required></textarea></div><div class="form-field"><label for="referral">' + form.referral + '</label><select id="referral" name="referral"><option value="">' + form.referral_placeholder + '</option><option value="search">' + form.referral_search + '</option><option value="referral">' + form.referral_referral + '</option><option value="social">' + form.referral_social + '</option><option value="other">' + form.referral_other + '</option></select></div><div class="form-submit"><button type="submit" class="btn btn-filled">' + form.submit + '</button></div>';
}

// === MODAL ===
const modal = document.getElementById('bookModal');
const modalClose = document.getElementById('modalClose');
function openBookModal(slug) {
  const book = DATA[currentLang].books.books[slug];
  if (!book) return;
  if (book.cover) {
    document.getElementById('modalCover').src = 'images/covers/' + book.cover;
    document.getElementById('modalCover').alt = book.title;
  } else {
    document.getElementById('modalCover').src = '';
    document.getElementById('modalCover').alt = '';
  }
  let titleHtml = book.title;
  if (book.subtitle) titleHtml += '<em>' + book.subtitle + '</em>';
  document.getElementById('modalTitle').innerHTML = titleHtml;
  document.getElementById('modalAuthor').textContent = book.author;
  document.getElementById('modalDesc').textContent = book.description;
  const quotesEl = document.getElementById('modalQuotes');
  if (book.quotes && book.quotes.length > 0) {
    quotesEl.innerHTML = book.quotes.map(q => '<div class="book-modal-quote"><p>\u201C' + q.text + '\u201D</p><cite>\u2014 ' + q.source + '</cite></div>').join('');
    quotesEl.style.display = 'block';
  } else {
    quotesEl.style.display = 'none';
  }
  modal.classList.add('active');
  document.body.style.overflow = 'hidden';
  modalClose.focus();
}
function closeModal() { modal.classList.remove('active'); document.body.style.overflow = ''; }
modalClose.addEventListener('click', closeModal);
modal.addEventListener('click', e => { if (e.target === modal) closeModal(); });
document.addEventListener('keydown', e => { if (e.key === 'Escape') closeModal(); });

// === FULL RENDER ===
function render(lang) {
  currentLang = lang;
  const data = DATA[lang];
  renderMeta(data.content);
  renderChrome(data.content);
  renderPortfolio(data.content, data.books);
  renderTestimonials(data.content, data.testimonials);
  renderPhilosophy(data.content);
  renderAbout(data.content);
  renderSkills(data.content);
  renderServices(data.content);
  renderContact(data.content);
  // Observe newly-minted reveal elements
  observeReveals(document);
  // Re-wire nav hamburger (rebuilt in renderChrome)
  wireNav();
  // Re-wire smooth scroll
  wireSmoothScroll();
  // Update toggle state
  document.querySelectorAll('#langToggle button').forEach(b => {
    b.classList.toggle('active', b.dataset.lang === lang);
    b.setAttribute('aria-pressed', b.dataset.lang === lang);
  });
  // Update URL without full reload (but allow bookmarking)
  const url = new URL(window.location.href);
  if (lang === 'es') url.searchParams.set('lang', 'es');
  else url.searchParams.delete('lang');
  window.history.replaceState({}, '', url);
  // Persist
  try { localStorage.setItem('ui_lang', lang); } catch (e) {}
}

// === NAV WIRING ===
function wireNav() {
  const toggle = document.getElementById('navToggle');
  const links = document.getElementById('navLinks');
  // Remove any existing handlers by cloning
  const newToggle = toggle.cloneNode(true);
  toggle.parentNode.replaceChild(newToggle, toggle);
  newToggle.addEventListener('click', () => {
    const open = !newToggle.classList.contains('open');
    newToggle.classList.toggle('open');
    links.classList.toggle('open');
    newToggle.setAttribute('aria-expanded', open);
  });
  links.querySelectorAll('a').forEach(a => a.addEventListener('click', () => {
    newToggle.classList.remove('open');
    links.classList.remove('open');
    newToggle.setAttribute('aria-expanded', 'false');
  }));
}

// === SMOOTH SCROLL ===
let smoothScrollWired = false;
function wireSmoothScroll() {
  // Use event delegation on document so we don't double-bind on re-render.
  if (smoothScrollWired) return;
  smoothScrollWired = true;
  document.addEventListener('click', e => {
    const a = e.target.closest('a[href^="#"]');
    if (!a) return;
    const href = a.getAttribute('href');
    if (href === '#' || href.length <= 1) return;
    const target = document.querySelector(href);
    if (!target) return;
    e.preventDefault();
    const top = target.getBoundingClientRect().top + window.pageYOffset - 70;
    window.scrollTo({ top, behavior: 'smooth' });
  });
}

// === NAV SCROLL STYLING ===
const navEl = document.getElementById('nav');
window.addEventListener('scroll', () => navEl.classList.toggle('scrolled', window.scrollY > 60));

// === LANGUAGE TOGGLE WIRING ===
document.getElementById('langToggle').addEventListener('click', e => {
  const btn = e.target.closest('button[data-lang]');
  if (!btn) return;
  const lang = btn.dataset.lang;
  if (lang === currentLang) return;
  render(lang);
});

// === INITIAL RENDER ===
render(currentLang);

// === SCROLL-LINKED BACKGROUND FALLBACK ===
if (typeof CSS === "undefined" || !CSS.supports || !CSS.supports('animation-timeline', 'scroll()')) {
  const s = document.createElement('style');
  s.textContent = 'body::before { animation: none !important; }';
  document.head.appendChild(s);
  window.addEventListener('scroll', function() {
    const f = window.scrollY / (document.body.scrollHeight - window.innerHeight);
    document.body.style.setProperty('--scroll-offset', (f * -200) + 'vh');
  });
  const s2 = document.createElement('style');
  s2.textContent = 'body::before { background-position: 0 var(--scroll-offset, 0vh) !important; }';
  document.head.appendChild(s2);
}
</script>
